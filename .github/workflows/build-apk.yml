name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Dynamic Versioning
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="3.6.$BUILD_NUM"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          
          # Increment versionCode and versionName for seamless over-the-air installs
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/g" android/app/build.gradle

      - name: Inject Android Permissions
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Setup Permanent Signing Keystore (Prevents Install Conflicts & Play Protect Blocks)
        run: |
          keytool -genkeypair -v \
            -keystore android/app/wacampaign-release.jks \
            -alias wacampaign \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "EnterpriseWA2026" \
            -keypass "EnterpriseWA2026" \
            -dname "CN=WA Campaign, OU=Marketing, O=WhatsApp Systems, L=Chennai, ST=TamilNadu, C=IN"

      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa-campaign-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (For In-App Direct Updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WA Campaign Release v${{ env.VERSION_NAME }}"
          body: "Direct over-the-air in-place update package."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
