<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WA Campaign</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #182234;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #25d366;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body.light-theme {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-card: #f8fafc;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
        .header-actions { display: flex; gap: 14px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.3rem; color: var(--text); cursor: pointer; }

        .container { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; position: relative; }
        .empty-state { text-align: center; margin-top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }

        .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .group-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .group-card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .group-card-badge { background: rgba(37, 211, 102, 0.15); color: var(--primary); font-size: 0.8rem; font-weight: bold; padding: 3px 8px; border-radius: 12px; }
        .group-card-sub { font-size: 0.82rem; color: var(--text-muted); }

        .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: #000; border: none; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer; z-index: 90; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-card); color: var(--text); font-size: 0.92rem; margin-bottom: 12px; outline: none; }
        .btn { width: 100%; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); margin-top: 8px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
        .btn-action-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-action-row .btn { padding: 9px 10px; font-size: 0.85rem; background: var(--surface-card); border: 1px solid var(--border); color: var(--text); }

        .member-controls-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface-card); padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); font-size: 0.85rem; }
        .member-list-scroll { flex: 1; overflow-y: auto; max-height: 320px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; background: var(--bg); }
        .member-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); gap: 10px; }
        .member-item:last-child { border-bottom: none; }
        .member-item.selected { background: rgba(37, 211, 102, 0.08); }
        .member-item input[type="checkbox"] { width: 18px; height: 18px; margin-bottom: 0; cursor: pointer; }
        .member-info { flex: 1; display: flex; flex-direction: column; }
        .member-name { font-size: 0.95rem; font-weight: 600; }
        .member-phone { font-size: 0.8rem; color: var(--text-muted); }
        .member-actions { display: flex; gap: 8px; }
        .member-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; border-radius: 4px; }
        .member-btn:hover { background: var(--surface-card); }

        .pairing-banner { background: var(--surface-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
        .pairing-code-box { font-size: 1.6rem; letter-spacing: 5px; font-weight: 800; color: var(--primary); text-align: center; margin-top: 10px; padding: 10px; background: rgba(37, 211, 102, 0.1); border-radius: 8px; border: 1px dashed var(--primary); display: none; }

        .progress-box { background: var(--surface-card); border: 1px solid var(--border); border-radius: 8px; height: 12px; overflow: hidden; margin: 12px 0 6px 0; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
        .stat-item { background: var(--surface-card); padding: 6px; border-radius: 6px; border: 1px solid var(--border); }
        .stat-val { font-size: 1rem; font-weight: bold; }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
        <div class="header-title" id="appTitle">WA Campaign</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="shareApp()">📤</button>
        </div>
    </header>

    <div class="container" id="groupListContainer"></div>

    <button class="fab" onclick="openCreateGroupModal()">+</button>

    <!-- Create Group Modal -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <div class="modal-title">Create Group</div>
            
            <label>Group Name</label>
            <input type="text" id="newGroupName" placeholder="e.g. November Customers">

            <label>Add Contacts</label>
            <div class="btn-action-row">
                <button type="button" class="btn" onclick="openPhonebookSelector('create')">📱 Select Contacts</button>
                <button type="button" class="btn" onclick="document.getElementById('csvFileInputCreate').click()">📁 Import File</button>
                <input type="file" id="csvFileInputCreate" accept=".csv,.txt,.vcf" style="display: none;" onchange="handleFileImport(event, 'create')">
            </div>

            <!-- Staged Contacts Badge Summary -->
            <div id="createStagedCount" style="font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-bottom: 8px;">0 Contacts Staged</div>

            <label>Direct Entry (One per line, Name,Phone OR Phone)</label>
            <textarea id="newGroupContacts" rows="4" placeholder="919791833275&#10;John,917904220952"></textarea>

            <button class="btn btn-primary" onclick="saveGroup()">Save Group</button>
            <button class="btn btn-secondary" onclick="closeModal('createGroupModal')">Cancel</button>
        </div>
    </div>

    <!-- Phonebook Selector Modal (Search & Manual Multi-Select) -->
    <div class="modal" id="phonebookModal">
        <div class="modal-content">
            <div class="modal-title">Select Contacts</div>
            <input type="text" id="phonebookSearch" placeholder="🔍 Search by name or phone..." oninput="filterPhonebook()">
            
            <div class="member-controls-bar">
                <span id="pbSelectedCount">0 selected</span>
                <button class="member-btn" style="color: var(--primary); font-weight: bold; font-size: 0.85rem;" onclick="toggleSelectAllPB()">Select All</button>
            </div>

            <div class="member-list-scroll" id="phonebookListContainer"></div>

            <button class="btn btn-primary" onclick="confirmPhonebookSelection()">Add Selected Contacts</button>
            <button class="btn btn-secondary" onclick="closeModal('phonebookModal')">Cancel</button>
        </div>
    </div>

    <!-- Campaign Execution Modal -->
    <div class="modal" id="campaignModal">
        <div class="modal-content" style="overflow-y: auto;">
            <div class="modal-title" id="campGroupTitle">Group Campaign</div>
            
            <label>Message Content</label>
            <textarea id="campMessage" rows="4" placeholder="Enter message text..."></textarea>
            
            <label>Attachment (Image, PDF, Document)</label>
            <input type="file" id="campMedia">
            
            <button class="btn btn-primary" id="btnStartCamp" onclick="triggerCampaign()">Start Campaign</button>
            <button class="btn btn-outline" onclick="openMembersManager()">👥 View & Edit Members</button>
            <button class="btn btn-secondary" onclick="closeModal('campaignModal')">Close</button>

            <div id="liveProgressCard" style="display: none; margin-top: 14px;">
                <div class="progress-box"><div class="progress-bar" id="progressBar"></div></div>
                <div style="text-align: right; font-size: 0.75rem; color: var(--text-muted);" id="progressPercent">0%</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
                    <div class="stat-item"><div class="stat-val" style="color: var(--primary);" id="statSent">0</div><div class="stat-lbl">Sent</div></div>
                    <div class="stat-item"><div class="stat-val" style="color: var(--danger);" id="statFailed">0</div><div class="stat-lbl">Failed</div></div>
                    <div class="stat-item"><div class="stat-val" id="statPending">0</div><div class="stat-lbl">Pending</div></div>
                </div>
            </div>
            
            <button class="btn btn-danger" style="margin-top: 18px;" onclick="deleteActiveGroup()">Delete Group</button>
        </div>
    </div>

    <!-- Group Members Manager Modal -->
    <div class="modal" id="membersModal">
        <div class="modal-content">
            <div class="modal-title">Group Members</div>

            <label>Group Name</label>
            <input type="text" id="editGroupNameInput">

            <label>Add More Contacts</label>
            <div class="btn-action-row">
                <button type="button" class="btn" onclick="openPhonebookSelector('edit')">📱 Select Contacts</button>
                <button type="button" class="btn" onclick="document.getElementById('csvFileInputEdit').click()">📁 Import File</button>
                <input type="file" id="csvFileInputEdit" accept=".csv,.txt,.vcf" style="display: none;" onchange="handleFileImport(event, 'edit')">
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input type="tel" id="quickAddInput" placeholder="Add single: 91XXXXXXXXXX" style="margin-bottom: 0;">
                <button class="btn btn-primary" style="width: auto; padding: 0 16px;" onclick="addSingleContact()">Add</button>
            </div>

            <div class="member-controls-bar">
                <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 0; cursor: pointer; color: var(--text);">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
                    <span>Select All (<span id="selectedCountText">0</span>)</span>
                </label>
                <button class="member-btn" style="color: var(--danger); font-size: 0.85rem; font-weight: 600;" onclick="deleteSelectedContacts()">
                    🗑️ Delete Selected
                </button>
            </div>

            <div class="member-list-scroll" id="membersListContainer"></div>

            <button class="btn btn-primary" onclick="saveAndCloseMembers()">Save & Return</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content" style="overflow-y: auto;">
            <div class="modal-title">Settings & Pairing</div>
            
            <div class="pairing-banner">
                <label style="color: var(--text); font-weight: 600; margin-bottom: 8px;">Link WhatsApp Account</label>
                <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px;">Enter phone number with country code (e.g. 919876543210):</p>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="cfgPhoneNumber" placeholder="919876543210" style="margin-bottom: 0;">
                    <button class="btn btn-primary" style="width: auto; padding: 0 16px;" onclick="requestPairCode()">Pair</button>
                </div>
                <div id="pairCodeResult" class="pairing-code-box"></div>
            </div>

            <label>Theme</label>
            <select id="themeSelect" onchange="toggleTheme(this.value)">
                <option value="dark">Dark Theme</option>
                <option value="light">Light Theme</option>
            </select>

            <button class="btn btn-secondary" onclick="closeModal('settingsModal')">Close</button>
        </div>
    </div>

    <script>
        const CLOUD_SERVER_URL = "https://counters-infringement-fully-quote.trycloudflare.com";
        const API_BEARER_TOKEN = "marketing_engine_secret_2026";
        const SESSION_ID = "main_account";

        let groups = [];
        try {
            groups = JSON.parse(localStorage.getItem('app_groups') || '[]');
        } catch(e) {
            groups = [];
        }

        let activeGroupId = null;
        let selectedMemberIndices = new Set();
        let stagedContacts = []; 
        let cachedDeviceContacts = [];
        let selectedPbContacts = new Set();
        let pbTargetMode = 'create';
        let pollTimer = null;

        function toggleTheme(theme) {
            localStorage.setItem('app_theme', theme);
            if (theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            document.getElementById('themeSelect').value = theme;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openCreateGroupModal() {
            document.getElementById('newGroupName').value = '';
            document.getElementById('newGroupContacts').value = '';
            stagedContacts = [];
            updateStagedBadge();
            openModal('createGroupModal');
        }

        function updateStagedBadge() {
            document.getElementById('createStagedCount').innerText = `${stagedContacts.length} Contacts Selected`;
        }

        // --- In-App Manual Contact Picker ---
        async function openPhonebookSelector(mode) {
            pbTargetMode = mode;
            selectedPbContacts.clear();

            const ContactsPlugin = window.Capacitor?.Plugins?.Contacts;
            if (!ContactsPlugin) {
                alert('Contact plugin bridge loading. Use Import File or direct input if running on web.');
                return;
            }

            try {
                const perm = await ContactsPlugin.requestPermissions();
                if (perm.contacts === 'granted') {
                    const result = await ContactsPlugin.getContacts({
                        projection: { name: true, phones: true }
                    });

                    cachedDeviceContacts = [];
                    (result.contacts || []).forEach(c => {
                        const name = c.name?.display || c.name?.given || 'Unknown';
                        (c.phones || []).forEach(p => {
                            const clean = p.number.replace(/[^0-9]/g, '');
                            if (clean.length >= 10) {
                                cachedDeviceContacts.push({ name, phone: clean });
                            }
                        });
                    });

                    // Deduplicate
                    const map = new Map();
                    cachedDeviceContacts.forEach(item => map.set(item.phone, item));
                    cachedDeviceContacts = Array.from(map.values());

                    renderPhonebook(cachedDeviceContacts);
                    openModal('phonebookModal');
                } else {
                    alert('Contacts permission was denied.');
                }
            } catch (err) {
                alert('Contacts error: ' + err.message);
            }
        }

        function renderPhonebook(list) {
            const container = document.getElementById('phonebookListContainer');
            document.getElementById('pbSelectedCount').innerText = `${selectedPbContacts.size} selected`;

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">No matching contacts found.</div>';
                return;
            }

            container.innerHTML = list.map((c) => {
                const isSelected = selectedPbContacts.has(c.phone);
                return `
                    <div class="member-item ${isSelected ? 'selected' : ''}" onclick="togglePbSelection('${c.phone}')" style="cursor: pointer;">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); togglePbSelection('${c.phone}')">
                        <div class="member-info">
                            <span class="member-name">${c.name}</span>
                            <span class="member-phone">${c.phone}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function togglePbSelection(phone) {
            if (selectedPbContacts.has(phone)) {
                selectedPbContacts.delete(phone);
            } else {
                selectedPbContacts.add(phone);
            }
            filterPhonebook();
        }

        function toggleSelectAllPB() {
            if (selectedPbContacts.size === cachedDeviceContacts.length) {
                selectedPbContacts.clear();
            } else {
                cachedDeviceContacts.forEach(c => selectedPbContacts.add(c.phone));
            }
            filterPhonebook();
        }

        function filterPhonebook() {
            const query = (document.getElementById('phonebookSearch').value || '').toLowerCase();
            const filtered = cachedDeviceContacts.filter(c => 
                c.name.toLowerCase().includes(query) || c.phone.includes(query)
            );
            renderPhonebook(filtered);
        }

        function confirmPhonebookSelection() {
            const chosen = cachedDeviceContacts.filter(c => selectedPbContacts.has(c.phone));
            if (chosen.length === 0) return alert('Select at least one contact');

            if (pbTargetMode === 'create') {
                chosen.forEach(c => {
                    if (!stagedContacts.some(sc => sc.phone === c.phone)) {
                        stagedContacts.push(c);
                    }
                });
                updateStagedBadge();
            } else if (pbTargetMode === 'edit') {
                const group = groups.find(g => g.id === activeGroupId);
                if (group) {
                    chosen.forEach(c => {
                        if (!group.contacts.some(gc => (gc.phone || gc) === c.phone)) {
                            group.contacts.push(c);
                        }
                    });
                    renderMembersList();
                }
            }

            closeModal('phonebookModal');
            alert(`Added ${chosen.length} contacts.`);
        }

        // File importer parser
        function handleFileImport(e, target) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split(/[\r\n]+/);
                const imported = [];

                lines.forEach(line => {
                    const parts = line.split(/[,;\t]+/);
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        const phone = parts[1].replace(/[^0-9]/g, '');
                        if (phone.length >= 10) imported.push({ name, phone });
                    } else if (parts.length === 1) {
                        const phone = parts[0].replace(/[^0-9]/g, '');
                        if (phone.length >= 10) imported.push({ name: '', phone });
                    }
                });

                if (target === 'create') {
                    stagedContacts.push(...imported);
                    updateStagedBadge();
                } else {
                    const group = groups.find(g => g.id === activeGroupId);
                    if (group) {
                        group.contacts.push(...imported);
                        renderMembersList();
                    }
                }
                alert(`Imported ${imported.length} contacts.`);
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function saveGroup() {
            const name = document.getElementById('newGroupName').value.trim();
            const rawText = document.getElementById('newGroupContacts').value.trim();
            if (!name) return alert('Enter group name');

            const contacts = [...stagedContacts];
            if (rawText) {
                rawText.split(/[\r\n]+/).forEach(l => {
                    const clean = l.replace(/[^0-9]/g, '');
                    if (clean.length >= 10 && !contacts.some(c => (c.phone || c) === clean)) {
                        contacts.push({ name: '', phone: clean });
                    }
                });
            }

            if (contacts.length === 0) return alert('Select or enter at least one contact');

            const newGroup = {
                id: 'grp_' + Date.now(),
                name: name,
                contacts: contacts,
                createdAt: new Date().toLocaleDateString()
            };

            groups.push(newGroup);
            localStorage.setItem('app_groups', JSON.stringify(groups));
            closeModal('createGroupModal');
            renderGroups();
        }

        function renderGroups() {
            const container = document.getElementById('groupListContainer');
            if (!groups || groups.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No Groups Yet</h2><p>Tap the \'+\' button below to create your first group</p></div>';
                return;
            }

            container.innerHTML = groups.map(g => `
                <div class="group-card" onclick="openCampaignScreen('${g.id}')">
                    <div class="group-card-header">
                        <div class="group-card-title">${g.name}</div>
                        <div class="group-card-badge">${g.contacts.length} Contacts</div>
                    </div>
                    <div class="group-card-sub">Created: ${g.createdAt}</div>
                </div>
            `).join('');
        }

        function openCampaignScreen(id) {
            activeGroupId = id;
            const group = groups.find(g => g.id === id);
            if (!group) return;
            document.getElementById('campGroupTitle').innerText = `${group.name} (${group.contacts.length})`;
            document.getElementById('campMessage').value = '';
            document.getElementById('liveProgressCard').style.display = 'none';
            openModal('campaignModal');
        }

        // --- Members Manager Display (Shows Name + Phone) ---
        function openMembersManager() {
            const group = groups.find(g => g.id === activeGroupId);
            if (!group) return;
            document.getElementById('editGroupNameInput').value = group.name;
            selectedMemberIndices.clear();
            renderMembersList();
            closeModal('campaignModal');
            openModal('membersModal');
        }

        function renderMembersList() {
            const group = groups.find(g => g.id === activeGroupId);
            const container = document.getElementById('membersListContainer');
            document.getElementById('selectedCountText').innerText = selectedMemberIndices.size;
            document.getElementById('selectAllCheckbox').checked = group.contacts.length > 0 && selectedMemberIndices.size === group.contacts.length;

            if (!group || group.contacts.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">No contacts in this group.</div>';
                return;
            }

            container.innerHTML = group.contacts.map((c, index) => {
                const isSelected = selectedMemberIndices.has(index);
                const name = typeof c === 'object' && c.name ? c.name : '';
                const phone = typeof c === 'object' ? c.phone : c;
                return `
                    <div class="member-item ${isSelected ? 'selected' : ''}">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectMember(${index})">
                        <div class="member-info">
                            ${name ? `<span class="member-name">${name}</span>` : ''}
                            <span class="member-phone">${phone}</span>
                        </div>
                        <div class="member-actions">
                            <button class="member-btn" title="Edit" onclick="editSingleContact(${index})">✏️</button>
                            <button class="member-btn" style="color: var(--danger);" title="Delete" onclick="deleteSingleContact(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSelectMember(index) {
            if (selectedMemberIndices.has(index)) {
                selectedMemberIndices.delete(index);
            } else {
                selectedMemberIndices.add(index);
            }
            renderMembersList();
        }

        function toggleSelectAll(selectAll) {
            const group = groups.find(g => g.id === activeGroupId);
            selectedMemberIndices.clear();
            if (selectAll && group) {
                group.contacts.forEach((_, i) => selectedMemberIndices.add(i));
            }
            renderMembersList();
        }

        function addSingleContact() {
            const input = document.getElementById('quickAddInput');
            const clean = input.value.trim().replace(/[^0-9]/g, '');
            if (!clean || clean.length < 10) return alert('Enter a valid phone number');

            const group = groups.find(g => g.id === activeGroupId);
            if (group.contacts.some(c => (c.phone || c) === clean)) return alert('Number already in group');

            group.contacts.unshift({ name: '', phone: clean });
            input.value = '';
            renderMembersList();
        }

        function editSingleContact(index) {
            const group = groups.find(g => g.id === activeGroupId);
            const current = group.contacts[index];
            const currentPhone = typeof current === 'object' ? current.phone : current;
            const updated = prompt('Edit phone number:', currentPhone);
            if (updated === null) return;
            const clean = updated.trim().replace(/[^0-9]/g, '');
            if (!clean || clean.length < 10) return alert('Invalid phone number');

            if (typeof current === 'object') {
                group.contacts[index].phone = clean;
            } else {
                group.contacts[index] = { name: '', phone: clean };
            }
            renderMembersList();
        }

        function deleteSingleContact(index) {
            const group = groups.find(g => g.id === activeGroupId);
            group.contacts.splice(index, 1);
            selectedMemberIndices.delete(index);
            renderMembersList();
        }

        function deleteSelectedContacts() {
            if (selectedMemberIndices.size === 0) return alert('No contacts selected');
            if (!confirm(`Delete ${selectedMemberIndices.size} selected contacts?`)) return;

            const group = groups.find(g => g.id === activeGroupId);
            group.contacts = group.contacts.filter((_, i) => !selectedMemberIndices.has(i));
            selectedMemberIndices.clear();
            renderMembersList();
        }

        function saveAndCloseMembers() {
            const group = groups.find(g => g.id === activeGroupId);
            const updatedName = document.getElementById('editGroupNameInput').value.trim();
            if (updatedName) group.name = updatedName;

            localStorage.setItem('app_groups', JSON.stringify(groups));
            closeModal('membersModal');
            renderGroups();
            openCampaignScreen(activeGroupId);
        }

        function deleteActiveGroup() {
            if (!confirm('Delete this group?')) return;
            groups = groups.filter(g => g.id !== activeGroupId);
            localStorage.setItem('app_groups', JSON.stringify(groups));
            closeModal('campaignModal');
            renderGroups();
        }

        async function triggerCampaign() {
            const group = groups.find(g => g.id === activeGroupId);
            if (!group || group.contacts.length === 0) return alert('No contacts in group');
            const message = document.getElementById('campMessage').value.trim();
            const mediaInput = document.getElementById('campMedia');

            const cleanRecipients = group.contacts.map(c => typeof c === 'object' ? c.phone : c);

            const formData = new FormData();
            formData.append('sessionId', SESSION_ID);
            formData.append('recipients', JSON.stringify(cleanRecipients));
            formData.append('message', message);
            if (mediaInput.files[0]) formData.append('media', mediaInput.files[0]);

            document.getElementById('btnStartCamp').disabled = true;

            try {
                const res = await fetch(`${CLOUD_SERVER_URL}/api/message/send-bulk`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_BEARER_TOKEN}` },
                    body: formData
                });
                const data = await res.json();
                if (data.status === 'QUEUED') {
                    document.getElementById('liveProgressCard').style.display = 'block';
                    startProgressPolling();
                } else {
                    alert(data.error || 'Campaign start failed');
                    document.getElementById('btnStartCamp').disabled = false;
                }
            } catch (err) {
                alert('Connection Error: ' + err.message);
                document.getElementById('btnStartCamp').disabled = false;
            }
        }

        function startProgressPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`${CLOUD_SERVER_URL}/api/queue-status/${SESSION_ID}`, {
                        headers: { 'Authorization': `Bearer ${API_BEARER_TOKEN}` }
                    });
                    const d = await res.json();
                    if (!d || d.error) return;

                    document.getElementById('statTotal').innerText = d.total;
                    document.getElementById('statSent').innerText = d.sent;
                    document.getElementById('statFailed').innerText = d.failed;
                    document.getElementById('statPending').innerText = d.remaining;
                    document.getElementById('progressBar').style.width = d.progressPercent + '%';
                    document.getElementById('progressPercent').innerText = d.progressPercent + '%';

                    if (!d.isRunning && d.total > 0 && d.remaining === 0) {
                        clearInterval(pollTimer);
                        document.getElementById('btnStartCamp').disabled = false;
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 2000);
        }

        async function requestPairCode() {
            const phone = document.getElementById('cfgPhoneNumber').value.trim();
            const resBox = document.getElementById('pairCodeResult');

            if (!phone) return alert('Enter phone number');
            resBox.style.display = 'block';
            resBox.innerText = 'Requesting...';

            try {
                const res = await fetch(`${CLOUD_SERVER_URL}/api/pair`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${API_BEARER_TOKEN}` 
                    },
                    body: JSON.stringify({ sessionId: SESSION_ID, phoneNumber: phone })
                });
                const d = await res.json();
                if (d.pairingCode) {
                    resBox.innerText = d.pairingCode;
                } else {
                    resBox.innerText = d.error || 'Pairing failed';
                }
            } catch (err) {
                resBox.innerText = 'Error: ' + err.message;
            }
        }

        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: 'WA Campaign', text: 'WhatsApp Marketing Controller', url: window.location.href });
            } else {
                alert('App installed.');
            }
        }

        window.onload = () => {
            const savedTheme = localStorage.getItem('app_theme') || 'dark';
            toggleTheme(savedTheme);
            renderGroups();
        };
    </script>
</body>
</html>
