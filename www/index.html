<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WA Campaign</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #182234;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #25d366;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body.light-theme {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-card: #f8fafc;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
        .header-actions { display: flex; gap: 14px; align-items: center; }
        .icon-btn { background: none; border: none; font-size: 1.3rem; color: var(--text); cursor: pointer; }

        .container { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; position: relative; }
        .empty-state { text-align: center; margin-top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
        .empty-state p { font-size: 0.92rem; }

        .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .group-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .group-card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .group-card-badge { background: rgba(37, 211, 102, 0.15); color: var(--primary); font-size: 0.8rem; font-weight: bold; padding: 3px 8px; border-radius: 12px; }
        .group-card-sub { font-size: 0.82rem; color: var(--text-muted); }

        .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: #000; border: none; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.4); cursor: pointer; z-index: 90; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
        input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-card); color: var(--text); font-size: 0.92rem; margin-bottom: 14px; outline: none; }
        .btn { width: 100%; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); margin-top: 8px; }

        .progress-box { background: var(--surface-card); border: 1px solid var(--border); border-radius: 8px; height: 12px; overflow: hidden; margin: 12px 0 6px 0; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
        .stat-item { background: var(--surface-card); padding: 6px; border-radius: 6px; border: 1px solid var(--border); }
        .stat-val { font-size: 1rem; font-weight: bold; }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
        <div class="header-title" id="appTitle">WA Campaign</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="shareApp()">📤</button>
        </div>
    </header>

    <div class="container" id="groupListContainer"></div>

    <button class="fab" onclick="openCreateGroupModal()">+</button>

    <!-- Create Group Modal -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <div class="modal-title" id="txtNewGroupTitle">Create Group</div>
            <label id="lblGroupName">Group Name</label>
            <input type="text" id="newGroupName" placeholder="e.g. VIP Customers">
            <label id="lblGroupContacts">Phone Numbers (One per line or comma-separated)</label>
            <textarea id="newGroupContacts" rows="6" placeholder="919876543210&#10;919876543211"></textarea>
            <button class="btn btn-primary" onclick="saveGroup()" id="btnSaveGroup">Save Group</button>
            <button class="btn btn-secondary" onclick="closeModal('createGroupModal')" id="btnCancel">Cancel</button>
        </div>
    </div>

    <!-- Campaign Execution Modal -->
    <div class="modal" id="campaignModal">
        <div class="modal-content">
            <div class="modal-title" id="campGroupTitle">Group Campaign</div>
            <label>Message Content</label>
            <textarea id="campMessage" rows="4" placeholder="Enter message text..."></textarea>
            <label>Attachment (Image, PDF, Document)</label>
            <input type="file" id="campMedia">
            
            <button class="btn btn-primary" id="btnStartCamp" onclick="triggerCampaign()">Start Campaign</button>
            <button class="btn btn-secondary" onclick="closeModal('campaignModal')">Close</button>

            <div id="liveProgressCard" style="display: none; margin-top: 14px;">
                <div class="progress-box"><div class="progress-bar" id="progressBar"></div></div>
                <div style="text-align: right; font-size: 0.75rem; color: var(--text-muted);" id="progressPercent">0%</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Total</div></div>
                    <div class="stat-item"><div class="stat-val" style="color: var(--primary);" id="statSent">0</div><div class="stat-lbl">Sent</div></div>
                    <div class="stat-item"><div class="stat-val" style="color: var(--danger);" id="statFailed">0</div><div class="stat-lbl">Failed</div></div>
                    <div class="stat-item"><div class="stat-val" id="statPending">0</div><div class="stat-lbl">Pending</div></div>
                </div>
            </div>
            
            <button class="btn btn-danger" style="margin-top: 18px;" onclick="deleteActiveGroup()">Delete Group</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
