<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Marketing Controller</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #25d366;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        h2 { font-size: 1.05rem; margin-bottom: 12px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        label { font-size: 0.82rem; color: var(--text-dim); display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b1120; color: var(--text); font-size: 0.9rem; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 8px; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .CONNECTED { background: rgba(37, 211, 102, 0.2); color: var(--accent); }
        .DISCONNECTED { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .progress-bar-container { background: #0b1120; border-radius: 8px; height: 12px; overflow: hidden; margin: 12px 0 6px 0; }
        .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-top: 10px; }
        .stat-box { background: #0b1120; padding: 8px; border-radius: 6px; border: 1px solid var(--border); }
        .stat-val { font-size: 1.1rem; font-weight: bold; }
        .stat-lbl { font-size: 0.72rem; color: var(--text-dim); }
        .pairing-code { font-size: 1.5rem; letter-spacing: 4px; text-align: center; color: var(--accent); padding: 12px; background: #0b1120; border-radius: 8px; margin-top: 8px; display: none; }
        .hint { font-size: 0.75rem; color: #64748b; margin-top: -8px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>1. Session & Server Config</h2>
        <div style="display: flex; gap: 8px;">
            <div style="flex: 2;">
                <label>Server URL</label>
                <input type="text" id="serverUrl" value="http://localhost:3000">
            </div>
            <div style="flex: 1;">
                <label>Session ID</label>
                <input type="text" id="sessionId" value="main_account">
            </div>
        </div>

        <label>API Bearer Token</label>
        <input type="password" id="apiToken" value="marketing_engine_secret_2026">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
            <div id="statusBadge" class="status-badge DISCONNECTED">DISCONNECTED</div>
            <button class="btn btn-primary" style="width: auto; padding: 6px 16px;" onclick="checkStatus()">Check Status</button>
        </div>
    </div>

    <div class="card">
        <h2>2. Link Device (Pairing Code)</h2>
        <label>Phone Number (with country code, no + or spaces)</label>
        <input type="text" id="phoneNumber" placeholder="919876543210">
        <button class="btn btn-primary" onclick="requestPairingCode()">Generate 8-Digit Code</button>
        <div id="pairingCodeDisplay" class="pairing-code"></div>
    </div>

    <div class="card">
        <h2>3. Campaign Setup</h2>
        <label>Recipients (Newline/comma numbers OR JSON objects with variables)</label>
        <textarea id="recipients" rows="4" placeholder="919876543210&#10;919876543211&#10;OR JSON: [{&quot;phone&quot;:&quot;919876543210&quot;,&quot;name&quot;:&quot;John&quot;}]"></textarea>

        <label>Message Content (Supports Spintax &amp; Placeholders)</label>
        <textarea id="message" rows="3" placeholder="{Hi|Hello|Hey} {{name}}, your offer is ready!"></textarea>
        <div class="hint">Use <code>{Hi|Hello}</code> for Spintax and <code>{{name}}</code> for custom fields.</div>

        <div style="display: flex; gap: 8px;">
            <div style="flex: 2;">
                <label>Media File (Image, PDF, Document, Video)</label>
                <input type="file" id="mediaFile" accept="image/*,video/*,application/pdf,.doc,.docx,.xlsx">
            </div>
            <div style="flex: 1;">
                <label>Safety Limit</label>
                <input type="number" id="warmUpLimit" value="300">
            </div>
        </div>

        <button id="sendBtn" class="btn btn-primary" onclick="startCampaign()">Start Campaign</button>
    </div>

    <div class="card">
        <h2>4. Live Execution Controls</h2>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim);">
            <span id="runState">Idle</span>
            <span id="progressText">0%</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><div class="stat-val" id="totalCount">0</div><div class="stat-lbl">Total</div></div>
            <div class="stat-box"><div class="stat-val" style="color: var(--accent);" id="sentCount">0</div><div class="stat-lbl">Sent</div></div>
            <div class="stat-box"><div class="stat-val" style="color: var(--danger);" id="failedCount">0</div><div class="stat-lbl">Failed</div></div>
            <div class="stat-box"><div class="stat-val" id="remCount">0</div><div class="stat-lbl">Remaining</div></div>
        </div>

        <div class="btn-group" style="margin-top: 14px;">
            <button id="pauseBtn" class="btn btn-warning" onclick="togglePause()" disabled>Pause</button>
            <button id="abortBtn" class="btn btn-danger" onclick="abortCampaign()" disabled>Abort</button>
        </div>
    </div>
</div>

<script>
    let pollInterval = null;
    let isPausedState = false;

    function getBaseUrl() {
        return document.getElementById('serverUrl').value.replace(/\/$/, '');
    }

    function getSessionId() {
        return document.getElementById('sessionId').value.trim();
    }

    function getHeaders(isJson = true) {
        const token = document.getElementById('apiToken').value.trim();
        const headers = { 'Authorization': `Bearer ${token}` };
        if (isJson) headers['Content-Type'] = 'application/json';
        return headers;
    }

    async function checkStatus() {
        const url = getBaseUrl();
        const session = getSessionId();
        const badge = document.getElementById('statusBadge');

        try {
            const res = await fetch(`${url}/api/status/${session}`, { headers: getHeaders() });
            const data = await res.json();
            badge.innerText = data.status;
            badge.className = `status-badge ${data.status}`;
            await fetchProgress();

            if (data.activeCampaign && !pollInterval) startPolling();
        } catch {
            badge.innerText = 'OFFLINE';
            badge.className = 'status-badge DISCONNECTED';
        }
    }

    async function requestPairingCode() {
        const url = getBaseUrl();
        const session = getSessionId();
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const display = document.getElementById('pairingCodeDisplay');

        if (!phoneNumber) return alert('Phone number required');
        display.style.display = 'block';
        display.innerText = 'Generating...';

        try {
            const res = await fetch(`${url}/api/pair`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ sessionId: session, phoneNumber })
            });
            const data = await res.json();
            display.innerText = data.pairingCode || data.error || 'Failed';
        } catch {
            display.innerText = 'Connection Error';
        }
    }

    async function startCampaign() {
        const url = getBaseUrl();
        const session = getSessionId();
        const recipientsRaw = document.getElementById('recipients').value.trim();
        const message = document.getElementById('message').value;
        const limit = document.getElementById('warmUpLimit').value;
        const fileInput = document.getElementById('mediaFile');

        if (!recipientsRaw) return alert('Recipient list is empty.');

        let recipients;
        try {
            recipients = JSON.parse(recipientsRaw);
        } catch {
            recipients = recipientsRaw.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
        }

        const formData = new FormData();
        formData.append('sessionId', session);
        formData.append('recipients', typeof recipients === 'string' ? recipients : JSON.stringify(recipients));
        formData.append('message', message);
        formData.append('warmUpLimit', limit);
        if (fileInput.files[0]) formData.append('media', fileInput.files[0]);

        document.getElementById('sendBtn').disabled = true;

        try {
            const res = await fetch(`${url}/api/message/send-bulk`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${document.getElementById('apiToken').value.trim()}` },
                body: formData
            });
            const data = await res.json();

            if (data.status === 'QUEUED') {
                startPolling();
            } else {
                alert(data.error || 'Dispatch error');
                document.getElementById('sendBtn').disabled = false;
            }
        } catch (err) {
            alert('Request Failed: ' + err.message);
            document.getElementById('sendBtn').disabled = false;
        }
    }

    async function togglePause() {
        const url = getBaseUrl();
        const session = getSessionId();
        const endpoint = isPausedState ? '/api/queue/resume' : '/api/queue/pause';

        await fetch(`${url}${endpoint}`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ sessionId: session })
        });
        fetchProgress();
    }

    async function abortCampaign() {
        if (!confirm('Are you sure you want to abort the active campaign?')) return;
        const url = getBaseUrl();
        const session = getSessionId();

        await fetch(`${url}/api/queue/abort`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ sessionId: session })
        });
        fetchProgress();
    }

    function startPolling() {
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchProgress, 2000);
        fetchProgress();
    }

    async function fetchProgress() {
        const url = getBaseUrl();
        const session = getSessionId();

        try {
            const res = await fetch(`${url}/api/queue-status/${session}`, { headers: getHeaders() });
            const data = await res.json();
            if (data.error) return;

            document.getElementById('totalCount').innerText = data.total;
            document.getElementById('sentCount').innerText = data.sent;
            document.getElementById('failedCount').innerText = data.failed;
            document.getElementById('remCount').innerText = data.remaining;
            document.getElementById('progressBar').style.width = data.progressPercent + '%';
            document.getElementById('progressText').innerText = data.progressPercent + '%';

            isPausedState = data.isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            const abortBtn = document.getElementById('abortBtn');
            const sendBtn = document.getElementById('sendBtn');
            const runState = document.getElementById('runState');

            if (data.isRunning) {
                sendBtn.disabled = true;
                pauseBtn.disabled = false;
                abortBtn.disabled = false;
                pauseBtn.innerText = isPausedState ? 'Resume' : 'Pause';
                runState.innerText = isPausedState ? 'Status: PAUSED' : 'Status: RUNNING';
            } else {
                sendBtn.disabled = false;
                pauseBtn.disabled = true;
                abortBtn.disabled = true;
                pauseBtn.innerText = 'Pause';
                runState.innerText = data.total > 0 && data.remaining === 0 ? 'Status: FINISHED' : 'Status: IDLE';
                if (pollInterval && data.remaining === 0) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }
        } catch (err) {
            console.error('Progress sync error:', err);
        }
    }

    window.onload = checkStatus;
</script>

</body>
</html>
